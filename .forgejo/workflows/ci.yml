name: CI

# Le ci.yml est dédié au flux post-merge (push sur main).
# Les PR seront gérées par pr.yml (à ajouter quand le mécanisme cross-repo
# du graphe Vidocq sera stabilisé) qui builde + déploie en pr-staging.
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Install Maven 4
        run: |
          wget -q https://dlcdn.apache.org/maven/maven-4/4.0.0-rc-5/binaries/apache-maven-4.0.0-rc-5-bin.tar.gz
          tar -xzf apache-maven-4.0.0-rc-5-bin.tar.gz -C /opt
          echo "/opt/apache-maven-4.0.0-rc-5/bin" >> "$GITHUB_PATH"

      - name: Configure Maven credentials
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <settings>
            <servers>
              <server>
                <id>vidocq-snapshots</id>
                <username>vidocq-ci-deploy</username>
                <password>${{ secrets.MAVEN_DEPLOY_TOKEN }}</password>
                <configuration>
                  <httpConfiguration><all><usePreemptive>true</usePreemptive></all>
                  </httpConfiguration>
                </configuration>
              </server>
              <server>
                <id>vidocq-releases</id>
                <username>vidocq-ci-deploy</username>
                <password>${{ secrets.MAVEN_DEPLOY_TOKEN }}</password>
                <configuration>
                  <httpConfiguration><all><usePreemptive>true</usePreemptive></all>
                  </httpConfiguration>
                </configuration>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build & test
        run: mvn -B -ntp verify

  # =====================================================================
  # TCK officiel MicroProfile Health 4.0.
  #
  # Le module knock-tck est volontairement HORS reactor (POM Model 4.0.0
  # standalone, contrainte ShrinkWrap héritée de cassini-tck/foy-tck/
  # champollion-tck/ravel-tck). Ce job l'invoque directement par script
  # après un install local du reactor.
  #
  # L'artefact `org.eclipse.microprofile.health:microprofile-health-tck:4.0`
  # est public sur Maven Central — aucun install manuel n'est requis.
  # =====================================================================
  tck-mp-health:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Install Maven 4
        run: |
          wget -q https://dlcdn.apache.org/maven/maven-4/4.0.0-rc-5/binaries/apache-maven-4.0.0-rc-5-bin.tar.gz
          tar -xzf apache-maven-4.0.0-rc-5-bin.tar.gz -C /opt
          echo "/opt/apache-maven-4.0.0-rc-5/bin" >> "$GITHUB_PATH"

      - name: Configure Maven credentials
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <settings>
            <servers>
              <server>
                <id>vidocq-snapshots</id>
                <username>vidocq-ci-deploy</username>
                <password>${{ secrets.MAVEN_DEPLOY_TOKEN }}</password>
                <configuration>
                  <httpConfiguration><all><usePreemptive>true</usePreemptive></all>
                  </httpConfiguration>
                </configuration>
              </server>
              <server>
                <id>vidocq-releases</id>
                <username>vidocq-ci-deploy</username>
                <password>${{ secrets.MAVEN_DEPLOY_TOKEN }}</password>
                <configuration>
                  <httpConfiguration><all><usePreemptive>true</usePreemptive></all>
                  </httpConfiguration>
                </configuration>
              </server>
            </servers>
          </settings>
          EOF

      - name: Install reactor (skip tests)
        run: mvn -B -ntp install -DskipTests

      - name: MicroProfile Health 4.0 TCK
        run: |
          if [ -x ./run-official-tck-mp-health-4.0.sh ]; then
            ./run-official-tck-mp-health-4.0.sh all
          else
            echo "::error::run-official-tck-mp-health-4.0.sh not executable or missing"
            exit 1
          fi

      - name: Upload TCK MP Health report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: tck-mp-health-report
          path: knock-tck/target/tck-report*.txt
          if-no-files-found: ignore

  deploy:
    runs-on: ubuntu-latest
    # ⚠ deploy dépend de `build` et non de `tck-mp-health` :
    # knock-tck (hors reactor) requiert `cassini-tck:0.1.0-SNAPSHOT` qui
    # n'est pas publié en snapshots (cassini-tck est lui-même hors reactor
    # cassini, contrainte ShrinkWrap). Tant qu'on n'a pas un mécanisme pour
    # publier cassini-tck, knock-tck plante mais on veut quand même que knock
    # soit deployé pour que vidocq-mps puisse le consommer en snapshots.
    needs: build

    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Install Maven 4
        run: |
          wget -q https://dlcdn.apache.org/maven/maven-4/4.0.0-rc-5/binaries/apache-maven-4.0.0-rc-5-bin.tar.gz
          tar -xzf apache-maven-4.0.0-rc-5-bin.tar.gz -C /opt
          echo "/opt/apache-maven-4.0.0-rc-5/bin" >> "$GITHUB_PATH"

      - name: Configure Maven credentials
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <settings>
            <servers>
              <server>
                <id>vidocq-snapshots</id>
                <username>vidocq-ci-deploy</username>
                <password>${{ secrets.MAVEN_DEPLOY_TOKEN }}</password>
                <configuration>
                  <httpConfiguration><all><usePreemptive>true</usePreemptive></all>
                  </httpConfiguration>
                </configuration>
              </server>
              <server>
                <id>vidocq-releases</id>
                <username>vidocq-ci-deploy</username>
                <password>${{ secrets.MAVEN_DEPLOY_TOKEN }}</password>
                <configuration>
                  <httpConfiguration><all><usePreemptive>true</usePreemptive></all>
                  </httpConfiguration>
                </configuration>
              </server>
            </servers>
          </settings>
          EOF

      - name: Deploy to Forgejo Maven registry
        run: mvn -B -ntp deploy -DskipTests
