# Pull-request validation in a SINGLE job. There is NO staging registry anymore
# (the old Reposilite repo.vidocq.dev is gone, and Maven Central cannot host
# ephemeral PR artifacts): the producer AND every impacted downstream consumer is
# built and resolved straight from the runner's local ~/.m2.
#
#   1. build the producer at a release-style PR version  -> installed in ~/.m2
#   2. ci/build-impacted resolves the transitive consumers from the Vidocq graph
#      and rebuilds each one, in topological order, against those local PR
#      artifacts (release versions are immutable for Maven, so they are never
#      re-fetched from the network — no -SNAPSHOT, no offline, no central pollution).
#
# The success of this single `pr-validate` job is the only required check to set
# in branch protection.
#
# Kept in sync with GestionProjet/workflow-templates/pr-producer.yml — edit there
# and re-propagate to every producer repo.
#
# Prerequisite: org secret VIDOCQ_BOT_TOKEN (read graph, clone consumers, query API).
#               org secret SLACK_WEBHOOK_URL (success notification).
name: pr-validate
on:
  pull_request:
    branches: [main]

jobs:
  cla-check:
    name: CLA signature check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout governance repository
        uses: actions/checkout@v4
        with:
          repository: vidocq/governance
          ref: main
          path: governance

      - name: Check CLA signature
        run: |
          AUTHOR="${{ inputs.pr-author }}"
          if grep -qi "$AUTHOR" governance/CLA-signatures/individuals.md; then
            echo "✅ CLA signed by $AUTHOR"
          else
            echo "❌ $AUTHOR has not signed the Vidocq CLA."
            echo ""
            echo "Please open a separate pull request on vidocq/governance"
            echo "adding your name to CLA-signatures/individuals.md."
            echo "See https://codeberg.org/vidocq/governance/src/branch/main/CONTRIBUTING.md"
            exit 1
          fi

  gpg-check:
    name: GPG signature check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout calling repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout governance repository (for GPG keys)
        uses: actions/checkout@v4
        with:
          repository: vidocq/governance
          ref: main
          path: governance

      - name: Import contributors GPG public keys
        run: |
          for keyfile in governance/.forgejo/keys/*.asc; do
            [ -f "$keyfile" ] || continue
            gpg --import "$keyfile" 2>/dev/null && \
              echo "Imported: $keyfile" || true
          done

      - name: Check GPG signatures on all commits
        run: |
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            BASE_REF="origin/$GITHUB_BASE_REF"
          elif git show-ref --verify --quiet refs/remotes/origin/HEAD; then
            BASE_REF="$(git symbolic-ref --short refs/remotes/origin/HEAD)"
          else
            BASE_REF="origin/main"
          fi

          UNSIGNED=$(git log "$BASE_REF"..HEAD --format="%H %ae" | \
            while read -r hash email; do
              git verify-commit "$hash" 2>/dev/null || echo "  $hash ($email)"
            done)
          if [ -n "$UNSIGNED" ]; then
            echo "❌ The following commits are not GPG-signed or have invalid signatures:"
            echo "$UNSIGNED"
            echo ""
            echo "All commits must be GPG-signed."
            echo "See https://codeberg.org/vidocq/governance/src/branch/main/CONTRIBUTING.md#set-up-gpg-commit-signing"
            exit 1
          else
            echo "✅ All commits are correctly GPG-signed"
          fi

  signoff-check:
    name: Signed-off-by check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout calling repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Signed-off-by on all commits
        run: |
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            BASE_REF="origin/$GITHUB_BASE_REF"
          elif git show-ref --verify --quiet refs/remotes/origin/HEAD; then
            BASE_REF="$(git symbolic-ref --short refs/remotes/origin/HEAD)"
          else
            BASE_REF="origin/main"
          fi

          MISSING=$(git log "$BASE_REF"..HEAD --format="%H" | \
            while read -r hash; do
              body=$(git log -1 --format="%B" "$hash")
              echo "$body" | grep -q "^Signed-off-by:" || echo "  $hash"
            done)
          if [ -n "$MISSING" ]; then
            echo "❌ The following commits are missing a Signed-off-by trailer:"
            echo "$MISSING"
            echo ""
            echo "Use: git config --local format.signoff true"
            echo "Or:  git commit --signoff"
            exit 1
          else
            echo "✅ All commits have a Signed-off-by trailer"
          fi

  pr-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: https://codeberg.org/Vidocq/ci/setup-maven@main

      - name: Compute PR version (release-style, no -SNAPSHOT)
        id: version
        run: |
          # Parse pom.xml directly with Python — `mvn help:evaluate -q` does not strip all
          # [INFO] lines on Maven 4, which yields corrupted versions. Namespace detected
          # dynamically (Model 4.0.0 vs 4.1.0).
          BASE=$(python3 - <<'PY'
          import re, sys, xml.etree.ElementTree as ET
          root = ET.parse("pom.xml").getroot()
          ns = root.tag[1:].split("}", 1)[0] if root.tag.startswith("{") else ""
          v = root.find(f"{{{ns}}}version") if ns else root.find("version")
          if v is None or not v.text:
              sys.stderr.write(f"root <version> not found (ns={ns!r})\n"); sys.exit(1)
          print(re.sub(r"-SNAPSHOT$", "", v.text.strip()))
          PY
          )
          if [ -z "$BASE" ]; then
            echo "Could not read project.version from pom.xml" >&2; exit 1
          fi
          SHA8="${{ github.event.pull_request.head.sha }}"; SHA8="${SHA8:0:8}"
          SUFFIX="PR${{ github.event.number }}.${SHA8}"
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
          echo "version=${BASE}-${SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "PR version: ${BASE}-${SUFFIX}"

      - name: Set PR version across the reactor
        run: |
          mvn -B -ntp versions:set \
            -DnewVersion=${{ steps.version.outputs.version }} \
            -DprocessAllModules=true -DgenerateBackupPoms=false

      - name: Sync plugin.xml descriptors with the PR version
        # versions:set does not touch resources; maven-plugin modules embed a plugin.xml
        # with a hardcoded <version> — without this sync the plugin JAR ships a stale
        # descriptor and every consumer fails with "Plugin's descriptor contains the wrong
        # version".
        run: |
          python3 - <<'PY'
          import re, xml.etree.ElementTree as ET
          from pathlib import Path
          rp = ET.parse("pom.xml").getroot()
          ns = rp.tag[1:].split("}", 1)[0] if rp.tag.startswith("{") else ""
          v = rp.find(f"{{{ns}}}version") if ns else rp.find("version")
          version = v.text.strip()
          n = 0
          for pom in Path(".").rglob("pom.xml"):
              if "target" in pom.parts:
                  continue
              try:
                  r = ET.parse(pom).getroot()
              except ET.ParseError:
                  continue
              pns = r.tag[1:].split("}", 1)[0] if r.tag.startswith("{") else ""
              pkg = r.find(f"{{{pns}}}packaging") if pns else r.find("packaging")
              if pkg is None or (pkg.text or "").strip() != "maven-plugin":
                  continue
              px = pom.parent / "src/main/resources/META-INF/maven/plugin.xml"
              if not px.is_file():
                  continue
              content = px.read_text(encoding="utf-8")
              new = re.sub(r"(<artifactId>[^<]+</artifactId>\s*\n\s*<version>)[^<]+(</version>)",
                           rf"\g<1>{version}\g<2>", content, count=1)
              if new != content:
                  px.write_text(new, encoding="utf-8"); n += 1
          print(f"plugin.xml synced: {n}")
          PY

      - name: Build, test & install the producer locally
        # install (not deploy): the PR artifact lands in ~/.m2 only — nothing is published.
        # install runs the full lifecycle incl. integration-test/verify.
        run: mvn -B -ntp install

      - name: Rebuild impacted downstream consumers against the local PR artifacts
        uses: https://codeberg.org/Vidocq/ci/build-impacted@main
        with:
          producer-slug: ${{ github.repository }}
          producer-version: ${{ steps.version.outputs.version }}
          version-suffix: ${{ steps.version.outputs.suffix }}
          bot-token: ${{ secrets.VIDOCQ_BOT_TOKEN }}

      - name: Notify Slack on PR success
        if: success()
        uses: https://codeberg.org/Vidocq/ci/notify-slack@main
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: pr-validated
          repo: ${{ github.repository }}
          pr-number: ${{ github.event.number }}
          pr-title: ${{ github.event.pull_request.title }}
          pr-author: ${{ github.event.pull_request.user.login }}
          pr-url: ${{ github.event.pull_request.html_url }}
